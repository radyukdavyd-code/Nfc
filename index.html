<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Завантаження системи...</title>
    <style>
        /* Робимо весь екран однією великою кнопкою */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #0d0d13; 
            overflow: hidden; 
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        /* Елементи завантаження */
        .loader-container {
            text-align: center;
            color: #707080;
        }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.05); 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            border-left-color: #00ff66; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .text { font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body onclick="playLoudAudio()">

    <div class="loader-container">
        <div class="spinner"></div>
        <div class="text">ЗАВАНТАЖЕННЯ...</div>
    </div>

    <!-- ТУТ ВСТАВЛЯТИ ЗВУК (Змініть посилання у src) -->
    <audio id="screamer" src="rbd.mp3" preload="auto" loop></audio>

    <script>
        function playLoudAudio() {
            var audio = document.getElementById("screamer");
            
            // 1. Збільшуємо гучність самого плеєра на максимум
            audio.volume = 1.0; 
            
            // 2. Запускаємо відтворення
            audio.play().then(() => {
                // Зміна тексту після успішного запуску
                document.querySelector('.text').innerText = "ВІДТВОРЕННЯ...";
                document.querySelector('.text').style.color = "#00ff66";
            }).catch(e => {
                console.log("Помилка відтворення:", e);
            });
        }
    </script>
</body>
</html>
